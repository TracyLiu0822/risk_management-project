[alembic]
script_location = migrations

# sqlalchemy.url is preferred to be read from env; keep blank or set a local default
sqlalchemy.url = sqlite+aiosqlite:///./risk_management.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
